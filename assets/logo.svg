<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-labelledby="title desc">
  <title id="title">ClawBadge logo</title>
  <desc id="desc">A lobster-inspired ocean-tech logo for ClawBadge.</desc>
  <defs>
    <linearGradient id="frame" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#0d2231" />
      <stop offset="100%" stop-color="#0e3a4a" />
    </linearGradient>
    <linearGradient id="shell" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#ff8a4c" />
      <stop offset="100%" stop-color="#d94f2b" />
    </linearGradient>
    <linearGradient id="shellAccent" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#ffd19b" />
      <stop offset="100%" stop-color="#f7e5c8" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#02060b" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="960" height="280" rx="52" fill="#07131f" />
  <circle cx="84" cy="58" r="124" fill="#0b2030" opacity="0.85" />
  <circle cx="886" cy="248" r="154" fill="#0c2437" opacity="0.72" />

  <g filter="url(#shadow)" transform="translate(32 32)">
    <rect width="216" height="216" rx="58" fill="url(#frame)" />
    <rect x="18" y="18" width="180" height="180" rx="44" fill="#081926" stroke="#15384a" stroke-width="2" />

    <g transform="translate(30 26)">
      <path d="M31 29c9-7 19-11 31-12" fill="none" stroke="#7dd3fc" stroke-linecap="round" stroke-width="5" />
      <path d="M124 29c-9-7-19-11-31-12" fill="none" stroke="#7dd3fc" stroke-linecap="round" stroke-width="5" />

      <ellipse cx="42" cy="68" rx="27" ry="34" fill="url(#shell)" />
      <circle cx="52" cy="69" r="12" fill="#081926" />
      <circle cx="28" cy="47" r="13" fill="#ffa56a" />

      <ellipse cx="114" cy="68" rx="27" ry="34" fill="url(#shell)" />
      <circle cx="104" cy="69" r="12" fill="#081926" />
      <circle cx="128" cy="47" r="13" fill="#ffa56a" />

      <rect x="61" y="84" width="34" height="58" rx="17" fill="url(#shellAccent)" />
      <rect x="53" y="116" width="50" height="13" rx="6.5" fill="#7dd3fc" />
      <rect x="41" y="143" width="74" height="16" rx="8" fill="#ff8a4c" />
      <rect x="49" y="164" width="58" height="12" rx="6" fill="#0f766e" />

      <circle cx="27" cy="115" r="8" fill="#0f766e" />
      <circle cx="129" cy="115" r="8" fill="#0f766e" />
      <circle cx="77.5" cy="25" r="7" fill="#f7e5c8" />
    </g>
  </g>

  <g transform="translate(286 72)">
    <text x="0" y="54" fill="#f7e5c8" font-family="Trebuchet MS, Verdana, sans-serif" font-size="76" font-weight="700" letter-spacing="-1.8">Claw<tspan fill="#ff8a4c">Badge</tspan></text>
    <text x="2" y="94" fill="#8fd8ff" font-family="Trebuchet MS, Verdana, sans-serif" font-size="24" font-weight="600">Live ClawHub badges for GitHub READMEs</text>

    <g transform="translate(0 128)">
      <rect width="160" height="36" rx="18" fill="#102433" stroke="#21485e" />
      <text x="28" y="24" fill="#f7e5c8" font-family="Trebuchet MS, Verdana, sans-serif" font-size="15" font-weight="700">clawhub stats</text>

      <rect x="178" width="188" height="36" rx="18" fill="#0f766e" />
      <text x="205" y="24" fill="#f3fbff" font-family="Trebuchet MS, Verdana, sans-serif" font-size="15" font-weight="700">svg badges + cards</text>

      <rect x="384" width="150" height="36" rx="18" fill="#ff8a4c" />
      <text x="413" y="24" fill="#fff7ef" font-family="Trebuchet MS, Verdana, sans-serif" font-size="15" font-weight="700">lobster theme</text>
    </g>
  </g>
